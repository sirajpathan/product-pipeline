name: retail-pricing-local

services:
  react-prod:
    build:
      context: ./ui/
      dockerfile: Dockerfile
    container_name: react_production_app
    ports:
      - "8080:80"
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: retail-pricing-redis
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:?Set REDIS_USERNAME in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - printf 'user %s on >%s ~* &* +@all\nuser default off\n' "$$REDIS_USERNAME" "$$REDIS_PASSWORD" > /tmp/users.acl && exec redis-server --appendonly yes --aclfile /tmp/users.acl
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - retail-net
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --user "$${REDIS_USERNAME}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:17.11-alpine
    container_name: retail-pricing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_pricing}
      POSTGRES_USER: ${POSTGRES_USER:-retail_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_app}
      # Init scripts in /docker-entrypoint-initdb.d run only on an empty data volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=512MB
      - -c
      - max_connections=150
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retail-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

